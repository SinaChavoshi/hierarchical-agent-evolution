# Generation 16 -- V6 epistemic-search PILOT, pass 3 (r3).
#
# Pass 2 (image v6-gen16-pilot-r2b) found a third defect: a probe the
# gatekeeper refused (invalid Python) left its hypothesis UNVERIFIED, so PUCT
# re-selected it 17 times and iterations 3-5 of gen_14_elite_1 burnt their
# budget on one syntax error while a SUPPORTED hypothesis on the sibling
# question was never synthesised. See commit 'fix(v6): UNTESTABLE hypotheses
# + in-place probe repair'.
# r3 is deliberately minimal -- ONE firm, index 0 of
# configs/generation_16_pilot_population.json (gen_14_elite_1), on image
# v6-gen16-pilot-r3 -- to check the fix on the firm that exposed it without
# spending more GPU time than the question deserves.
apiVersion: batch/v1
kind: Job
metadata:
  name: hae-gen16-v6-pilot-r3
  namespace: default
  labels:
    app: hae-gen16-v6-pilot-r3
    hae.generation: "16"
    hae.experiment-set: v6-epistemic-pilot-qwen38-180b
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 1
  maxFailedIndexes: 1
  # Keep finished pods around long enough to `kubectl cp` results and logs.
  # The pilot tear-down deletes the Job explicitly well before this expires.
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app: hae-gen16-v6-pilot-r3
        hae.generation: "16"
    spec:
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: firm-evaluator
        image: us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:v6-gen16-pilot-r3
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/bash"
        - "-c"
        - |
          python -m hae.orchestration.worker \
            --generation 16 \
            --region us-central1 \
            --population-file /app/configs/generation_16_pilot_population.json \
            --task-file /app/configs/tasks/self-hosting-fullstack-iter5.json \
            --output-dir /data/outputs \
            --objective "Implement the 4 core self-hosting modules of the Hierarchical Agent Evolution (HAE) engine: hae/evaluation/artifacts.py, hae/evaluation/harness.py, hae/evaluation/verification_loop.py, hae/genome/morphogenesis.py"
          RC=$?
          echo "WORKER_EXIT=$RC"
          # Harvest path 1: outputs as a base64 tarball in the pod log (GCS sync
          # from pods returned HTTP 403 in Gen 15, so the log is the durable copy).
          if [ -d /data/outputs/generation_16 ]; then
            echo "=== OUTPUT_TGZ_B64 BEGIN ==="
            tar czf - -C /data/outputs generation_16 | base64
            echo
            echo "=== OUTPUT_TGZ_B64 END ==="
          fi
          # Harvest path 2: keep the container alive so `kubectl cp` works.
          sleep 1500
          exit $RC
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "gemle-gke-dev"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: GCS_BUCKET
          value: "gemle-gke-dev-agent-evolution"
        - name: LLM_PROVIDER
          value: "vllm"
        - name: V5_TYPESAFE_PROTOCOL
          value: "1"
        - name: VLLM_BASE_URL
          value: "http://vllm-qwen38-gateway.default.svc.cluster.local:8000/v1"
        - name: VLLM_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: VLLM_MAX_TOKENS
          value: "8192"
        - name: WORKER_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: EXECUTIVE_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: JUDGE_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: HAE_REQUIRE_NETWORK_ISOLATION
          value: "0"
        - name: FIRM_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: workdir
          mountPath: /data
      volumes:
      - name: workdir
        emptyDir: {}
