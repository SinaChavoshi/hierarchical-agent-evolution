apiVersion: v1
kind: ConfigMap
metadata:
  name: beam-501b-loader-script
  namespace: default
data:
  download_weights.py: |
    import os
    import re
    import shutil
    import time
    import urllib.request
    from concurrent.futures import ThreadPoolExecutor
    from huggingface_hub import HfApi

    MAIN_REPO = "reflection/Beam-1.0-501B-A23B-NVFP4"
    DFLASH_REPO = "reflection/Beam-1.0-501B-A23B-DFlash2"
    WEIGHTS_ROOT = "/weights"
    RAM_ROOT = "/weights-ram"

    os.makedirs(f"{WEIGHTS_ROOT}/nvfp4", exist_ok=True)
    os.makedirs(f"{WEIGHTS_ROOT}/dflash2", exist_ok=True)
    os.makedirs(f"{RAM_ROOT}/nvfp4", exist_ok=True)

    def stream_file(url: str, target_path: str) -> None:
        tmp_path = target_path + ".part"
        for attempt in range(5):
            try:
                req = urllib.request.Request(url, headers={"User-Agent": "vllm-beam-loader/1.0"})
                with urllib.request.urlopen(req, timeout=900) as resp, open(tmp_path, "wb") as out:
                    shutil.copyfileobj(resp, out, length=16 * 1024 * 1024)
                os.replace(tmp_path, target_path)
                return
            except Exception as exc:
                print(f"[RETRY {attempt+1}/5] {url}: {exc}", flush=True)
                time.sleep(2 ** attempt)
        raise RuntimeError(f"Failed to download {url}")

    def use_ram_tier(fname: str) -> bool:
        m = re.match(r"model-layer-(\d+)\.safetensors$", fname)
        if m:
            layer_idx = int(m.group(1))
            return layer_idx <= 27
        return False

    def dl_main(fname: str) -> None:
        dst = os.path.join(WEIGHTS_ROOT, "nvfp4", fname)
        if os.path.exists(dst):
            return
        url = f"https://huggingface.co/{MAIN_REPO}/resolve/main/{fname}"
        if use_ram_tier(fname):
            ram_path = os.path.join(RAM_ROOT, "nvfp4", fname)
            os.makedirs(os.path.dirname(ram_path), exist_ok=True)
            if not os.path.exists(ram_path):
                stream_file(url, ram_path)
            os.makedirs(os.path.dirname(dst), exist_ok=True)
            try:
                os.symlink(ram_path, dst)
            except FileExistsError:
                pass
            print(f"[RAM-TIER] nvfp4/{fname} ready", flush=True)
        else:
            os.makedirs(os.path.dirname(dst), exist_ok=True)
            stream_file(url, dst)
            print(f"[NVME-TIER] nvfp4/{fname} ready", flush=True)

    def dl_dflash(fname: str) -> None:
        dst = os.path.join(WEIGHTS_ROOT, "dflash2", fname)
        if os.path.exists(dst):
            return
        url = f"https://huggingface.co/{DFLASH_REPO}/resolve/main/{fname}"
        os.makedirs(os.path.dirname(dst), exist_ok=True)
        stream_file(url, dst)
        print(f"[DFLASH] dflash2/{fname} ready", flush=True)

    api = HfApi()
    main_files = sorted(api.list_repo_files(MAIN_REPO))
    dflash_files = sorted(api.list_repo_files(DFLASH_REPO))
    print(f"Downloading {len(main_files)} files from {MAIN_REPO} and {len(dflash_files)} from {DFLASH_REPO}...", flush=True)
    t0 = time.time()
    with ThreadPoolExecutor(max_workers=8) as ex:
        list(ex.map(dl_main, main_files))
        list(ex.map(dl_dflash, dflash_files))
    print(f"All Beam-1.0-501B-A23B-NVFP4 + DFlash2 weights ready in {time.time() - t0:.1f}s!", flush=True)

    import socket
    hostname = socket.gethostname()
    m_host = re.match(r"beam-501b-(\d+)-(head|worker)", hostname)
    if m_host:
        group_idx = m_host.group(1)
        role = m_host.group(2)
        svc_name = f"beam-501b-ray-{group_idx}"
        pod_ip = socket.gethostbyname(hostname)
        if role == "head":
            master_ip = pod_ip
        else:
            print(f"[MP-WORKER] Resolving head service {svc_name}...", flush=True)
            master_ip = None
            for _ in range(360):
                try:
                    ip = socket.gethostbyname(svc_name)
                    if ip and ip != pod_ip:
                        master_ip = ip
                        break
                except Exception:
                    pass
                time.sleep(2)
            if not master_ip:
                raise RuntimeError(f"Could not resolve {svc_name}")
        os.environ["VLLM_HOST_IP"] = pod_ip
        os.environ["NCCL_SOCKET_IFNAME"] = "eth0"
        os.environ["GLOO_SOCKET_IFNAME"] = "eth0"
        cmd = [
            "vllm", "serve", "/weights/nvfp4",
            "--host", "0.0.0.0", "--port", "8000",
            "--served-model-name",
            "reflection/Beam-1.0-501B-A23B-NVFP4",
            "Beam-1.0-501B-A23B",
            "nvidia/Qwen3.8-Flash-Next-NVFP4",
            "Qwen/Qwen3-Coder-32B-Instruct",
            "Qwen3-Coder-32B",
            "--tensor-parallel-size", "4",
            "--distributed-executor-backend", "mp",
            "--nnodes", "2",
            "--node-rank", "0" if role == "head" else "1",
            "--master-addr", master_ip,
            "--master-port", "6379",
            "--dtype", "bfloat16",
            "--max-model-len", "131072",
            "--max-num-seqs", "8",
            "--gpu-memory-utilization", "0.92",
            "--enable-prefix-caching",
            "--enable-auto-tool-choice",
            "--tool-call-parser", "beam",
            "--reasoning-parser", "beam",
            "--default-chat-template-kwargs", '{"allow_missing_thinking": true}',
            "--structured-outputs-config", '{"backend":"xgrammar","reasoning_parser":"beam","disable_any_whitespace":true}',
            "--speculative-config", '{"method":"dflash","model":"/weights/dflash2","num_speculative_tokens":8}',
        ]
        if role == "worker":
            cmd.append("--headless")
        print(f"[VLLM-MP] Launching ({role}, group={group_idx}, master={master_ip}, self={pod_ip}): {' '.join(cmd)}", flush=True)
        os.execvp("vllm", cmd)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-501b-0-head
  namespace: default
  labels:
    app: beam-501b-nvfp4
    replica-group: beam-0
    role: head
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beam-501b-nvfp4
      replica-group: beam-0
      role: head
  template:
    metadata:
      labels:
        app: beam-501b-nvfp4
        replica-group: beam-0
        role: head
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: weights-ram
        emptyDir:
          medium: Memory
          sizeLimit: 165Gi
      - name: weights-disk
        emptyDir: {}
      - name: loader-script
        configMap:
          name: beam-501b-loader-script
      containers:
      - name: vllm
        image: vllm/vllm-openai:reflection-beam
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          python3 /scripts/download_weights.py
          POD_IP=$(hostname -i | awk '{print $1}')
          echo "[RAY-HEAD] Starting Ray head on ${POD_IP}:6379..."
          ray start --head --node-ip-address="${POD_IP}" --port=6379 --num-gpus=2 --disable-usage-stats
          echo "[RAY-HEAD] Waiting for 4 GPUs across 2 nodes in Ray cluster..."
          python3 -c '
          import subprocess, time
          for _ in range(360):
              out = subprocess.getoutput("ray status")
              if "4.0 GPU" in out or "/4.0 GPU" in out:
                  print("Ray cluster has 4 GPUs ready!", flush=True)
                  break
              time.sleep(5)
          else:
              raise RuntimeError("Timed out waiting for 4 GPUs in Ray cluster")
          '
          echo "[VLLM] Launching Beam-1.0-501B-A23B-NVFP4 with TP=4 + DFlash2..."
          exec vllm serve /weights/nvfp4 \
            --host 0.0.0.0 --port 8000 \
            --served-model-name reflection/Beam-1.0-501B-A23B-NVFP4 Beam-1.0-501B-A23B nvidia/Qwen3.8-Flash-Next-NVFP4 Qwen/Qwen3-Coder-32B-Instruct Qwen3-Coder-32B \
            --tensor-parallel-size 4 \
            --distributed-executor-backend ray \
            --dtype bfloat16 \
            --max-model-len 131072 \
            --max-num-seqs 8 \
            --gpu-memory-utilization 0.92 \
            --enable-prefix-caching \
            --enable-auto-tool-choice \
            --tool-call-parser beam \
            --reasoning-parser beam \
            --default-chat-template-kwargs '{"allow_missing_thinking": true}' \
            --structured-outputs-config '{"backend":"xgrammar","reasoning_parser":"beam","disable_any_whitespace":true}' \
            --speculative-config '{"method":"dflash","model":"/weights/dflash2","num_speculative_tokens":8}'
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 6379
          name: ray-gcs
        env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: VLLM_USE_V1
          value: "1"
        - name: NCCL_NVLS_ENABLE
          value: "0"
        resources:
          requests:
            cpu: "16"
            memory: 180Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "48"
            memory: 335Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: weights-ram
          mountPath: /weights-ram
        - name: weights-disk
          mountPath: /weights
        - name: loader-script
          mountPath: /scripts
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 15
---
apiVersion: apps/v1
