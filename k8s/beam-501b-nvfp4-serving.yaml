          limits:
            cpu: "48"
            memory: 335Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: weights-ram
          mountPath: /weights-ram
        - name: weights-disk
          mountPath: /weights
        - name: loader-script
          mountPath: /scripts
