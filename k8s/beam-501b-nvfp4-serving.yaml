            --max-num-seqs 8 \
            --gpu-memory-utilization 0.92 \
            --enable-prefix-caching \
            --enable-auto-tool-choice \
            --tool-call-parser beam \
            --reasoning-parser beam \
            --default-chat-template-kwargs '{"allow_missing_thinking": true}' \
            --structured-outputs-config '{"backend":"xgrammar","reasoning_parser":"beam","disable_any_whitespace":true}' \
            --speculative-config '{"method":"dflash","model":"/weights/dflash2","num_speculative_tokens":8}'
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 6379
          name: ray-gcs
        env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: VLLM_USE_V1
          value: "1"
        - name: NCCL_NVLS_ENABLE
          value: "0"
        resources:
          requests:
            cpu: "16"
            memory: 180Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "48"
            memory: 335Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: weights-ram
          mountPath: /weights-ram
        - name: weights-disk
          mountPath: /weights
        - name: loader-script
          mountPath: /scripts
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-501b-2-worker
  namespace: default
  labels:
    app: beam-501b-nvfp4
    replica-group: beam-2
    role: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beam-501b-nvfp4
      replica-group: beam-2
      role: worker
  template:
    metadata:
      labels:
        app: beam-501b-nvfp4
        replica-group: beam-2
        role: worker
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: weights-ram
        emptyDir:
          medium: Memory
          sizeLimit: 165Gi
      - name: weights-disk
        emptyDir: {}
      - name: loader-script
        configMap:
          name: beam-501b-loader-script
      containers:
      - name: vllm-worker
        image: vllm/vllm-openai:reflection-beam
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          python3 /scripts/download_weights.py
          POD_IP=$(hostname -i | awk '{print $1}')
          echo "[RAY-WORKER] Waiting for Ray head beam-501b-ray-2:6379..."
          python3 -c '
          import socket, time
          for _ in range(360):
              try:
                  with socket.create_connection(("beam-501b-ray-2", 6379), timeout=3):
                      print("Connected to beam-501b-ray-2:6379!", flush=True)
                      break
              except Exception:
                  time.sleep(3)
          else:
              raise RuntimeError("Timed out waiting for beam-501b-ray-2:6379")
          '
          HEAD_IP=$(python3 -c 'import socket; print(socket.gethostbyname("beam-501b-ray-2"))')
          echo "[RAY-WORKER] Joining Ray head at ${HEAD_IP}:6379 from ${POD_IP}..."
          exec ray start --block --address="${HEAD_IP}:6379" --node-ip-address="${POD_IP}" --num-gpus=2 --disable-usage-stats
        env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: VLLM_USE_V1
          value: "1"
        - name: NCCL_NVLS_ENABLE
          value: "0"
        resources:
          requests:
            cpu: "16"
            memory: 180Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "48"
            memory: 335Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: weights-ram
          mountPath: /weights-ram
        - name: weights-disk
          mountPath: /weights
        - name: loader-script
          mountPath: /scripts
