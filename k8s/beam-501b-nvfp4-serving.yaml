              except Exception:
                  time.sleep(3)
          else:
              raise RuntimeError("Timed out waiting for beam-501b-ray-0:6379")
          '
          HEAD_IP=$(python3 -c 'import socket; print(socket.gethostbyname("beam-501b-ray-0"))')
          echo "[RAY-WORKER] Joining Ray head at ${HEAD_IP}:6379 from ${POD_IP}..."
          exec ray start --block --address="${HEAD_IP}:6379" --node-ip-address="${POD_IP}" --num-gpus=2 --disable-usage-stats
        env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: VLLM_USE_V1
