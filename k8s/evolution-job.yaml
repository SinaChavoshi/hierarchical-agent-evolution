apiVersion: batch/v1
kind: Job
metadata:
  name: agent-evolution-self-hosting
  namespace: agent-evolution
  labels:
    app: agent-evolution-self-hosting
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: agent-evolution-self-hosting
    spec:
      serviceAccountName: agent-evolution-sa
      nodeSelector:
        cloud.google.com/gke-nodepool: evolution-pool
      restartPolicy: Never
      containers:
      - name: platform-evolution-orchestrator
        image: us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:latest
        imagePullPolicy: Always
        args:
        - "--mode"
        - "tournament"
        - "--population-size"
        - "5"
        - "--generations"
        - "2"
        - "--output-dir"
        - "/data/outputs"
        - "--objective"
        - "Design and implement the production-ready 'agent-org' platform: a Python package providing hierarchical multi-agent orchestration, OpenTelemetry observability anchors, deterministic sandbox execution, and evolutionary search. Generate clean package files including pyproject.toml, core genome models, execution runtime, and test suites."
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "gemle-gke-dev"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: WORKER_MODEL
          value: "gemini-2.5-flash"
        - name: EXECUTIVE_MODEL
          value: "gemini-2.5-pro"
        - name: JUDGE_MODEL
          value: "gemini-2.5-pro"
        - name: MUTATOR_MODEL
          value: "gemini-2.5-pro"
        - name: GCS_BUCKET
          value: "gemle-gke-dev-agent-evolution"
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        volumeMounts:
        - name: output-volume
          mountPath: /data
      volumes:
      - name: output-volume
        emptyDir: {}
