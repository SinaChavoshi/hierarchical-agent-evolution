apiVersion: v1
kind: Namespace
metadata:
  name: agent-evolution
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-evolution-sa
  namespace: agent-evolution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-evolution-role
  namespace: agent-evolution
rules:
- apiGroups: ["", "batch"]
  resources: ["pods", "jobs", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-evolution-rb
  namespace: agent-evolution
subjects:
- kind: ServiceAccount
  name: agent-evolution-sa
  namespace: agent-evolution
roleRef:
  kind: Role
  name: agent-evolution-role
  apiGroup: rbac.authorization.k8s.io
