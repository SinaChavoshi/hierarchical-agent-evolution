# Generation 16 -- V6 epistemic-search COHORT, run 3 (26 firm-runs; the same 26
# slots as runs 1 and 2: 8 non-converged Gen 15 lineages x 3 seeds + 2 controls).
#
# Image v6-gen16-cohort-r3 = main @ bdfa962: everything in
# v6-gen16-cohort-r2 plus the three day-2 tracks (see
# experiments/v6_epistemic_search/README.md):
#   * synthesis ladder -- anchored plan (fuzzy anchor) -> FUNCTION_REWRITE
#     (AST-spliced, grammar-constrained to the module's definitions) -> whole-
#     module rewrite only as a last resort; fail-fast when plan and function
#     rewrite are both no-ops; revert the module when the post-synthesis check
#     fails. Run 2 spent 8.0 h in 28 no-op synthesis chains (17 min mean).
#   * oracle reconciliation -- a question whose oracle failure CHANGED is
#     refreshed (text, epoch, uncertainty) instead of keeping stale text; tabu
#     and RULED OUT are scoped to the current failure epoch; the traceback
#     location (module:line in function) rides on the question; verify_module
#     gains a static undefined-name / except-as-leak gate. Run 2's three
#     non-recovering firms (23-26/50 for four iterations) were this shape.
#   * V7 heads in SHADOW mode -- hae/epistemic/heads/v7_{prior,value}_head.json
#     are loaded (population file sets epistemic_policy.extra), their
#     predictions are logged per move, prior_head_weight = 0.0 so selection is
#     byte-identical to run 2. Off-policy evaluation on fresh firms only.
# Population: configs/generation_16_r3_population.json (= generation_16 with
# the `extra` head keys). Compare held-out trajectories with runs 1 and 2 by
# first-pass class; the new primary metrics are synthesis minutes per written
# patch, no-op chain count, and whether the exists-but-wrong shapes move.
#
# Serving and pools as in runs 1-2 (k8s/cluster-setup.sh). Harvest:
# scripts/harvest_gen16_pilot.py --job-label app=hae-gen16-v6-cohort-r3
# --out-root results/hae_gen16_v6_cohort_r3. Tear down with k8s/teardown.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: hae-gen16-v6-cohort-r3
  namespace: default
  labels:
    app: hae-gen16-v6-cohort-r3
    hae.generation: "16"
    hae.experiment-set: v6-epistemic-cohort-qwen38-180b
spec:
  completionMode: Indexed
  completions: 26
  parallelism: 26
  # One retry per index covers a spot preemption; a second failure of the same
  # firm is a result, not noise.
  backoffLimitPerIndex: 1
  maxFailedIndexes: 26
  # Keep finished pods around long enough to harvest the tarball from the log
  # (and `kubectl cp` as a fallback). teardown.sh deletes the Job explicitly.
  ttlSecondsAfterFinished: 28800
  template:
    metadata:
      labels:
        app: hae-gen16-v6-cohort-r3
        hae.generation: "16"
    spec:
      # Firm pods are CPU-only and run on the on-demand `firm-pool`
      # (4 x e2-standard-32), NOT on the spot GPU nodes: a spot preemption
      # then costs the firm an LLM retry (the client retries 5x with backoff and
      # the gateway re-discovers replicas every 5 s), not the whole run.
      # On 2026-10-06 one of the four g4 spot nodes was preempted five minutes
      # after it came up, which is what prompted this.
      nodeSelector:
        cloud.google.com/gke-nodepool: firm-pool
      restartPolicy: Never
      containers:
      - name: firm-evaluator
        image: us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:v6-gen16-cohort-r3
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/bash"
        - "-c"
        - |
          python -m hae.orchestration.worker \
            --generation 16 \
            --region us-central1 \
            --population-file /app/configs/generation_16_r3_population.json \
            --task-file /app/configs/tasks/self-hosting-fullstack-iter5.json \
            --output-dir /data/outputs \
            --objective "Implement the 4 core self-hosting modules of the Hierarchical Agent Evolution (HAE) engine: hae/evaluation/artifacts.py, hae/evaluation/harness.py, hae/evaluation/verification_loop.py, hae/genome/morphogenesis.py"
          RC=$?
          echo "WORKER_EXIT=$RC"
          # Harvest path 1: outputs as a base64 tarball in the pod log (GCS sync
          # from pods returned HTTP 403 in Gen 15, so the log is the durable copy).
          if [ -d /data/outputs/generation_16 ]; then
            echo "=== OUTPUT_TGZ_B64 BEGIN ==="
            tar czf - -C /data/outputs generation_16 | base64
            echo
            echo "=== OUTPUT_TGZ_B64 END ==="
          fi
          # Harvest path 2: keep the container alive so `kubectl cp` works.
          sleep 1500
          exit $RC
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "gemle-gke-dev"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: GCS_BUCKET
          value: "gemle-gke-dev-agent-evolution"
        - name: LLM_PROVIDER
          value: "vllm"
        - name: V5_TYPESAFE_PROTOCOL
          value: "1"
        - name: VLLM_BASE_URL
          value: "http://vllm-qwen38-gateway.default.svc.cluster.local:8000/v1"
        - name: VLLM_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: VLLM_MAX_TOKENS
          value: "8192"
        - name: WORKER_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: EXECUTIVE_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: JUDGE_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: HAE_REQUIRE_NETWORK_ISOLATION
          value: "0"
        - name: FIRM_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: workdir
          mountPath: /data
      volumes:
      - name: workdir
        emptyDir: {}
