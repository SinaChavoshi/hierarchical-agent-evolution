apiVersion: batch/v1
kind: Job
metadata:
  name: hae-gen15-fullstack-v5
  namespace: default
  labels:
    app: hae-gen15-fullstack-v5
    hae.generation: "15"
    hae.experiment-set: v5-fullstack-self-hosting-qwen38-180b
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 5
  backoffLimitPerIndex: 1
  maxFailedIndexes: 10
  template:
    metadata:
      labels:
        app: hae-gen15-fullstack-v5
        hae.generation: "15"
    spec:
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: firm-evaluator
        image: us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:v4-qwen3-coder
        imagePullPolicy: Always
        command:
        - "/bin/bash"
        - "-c"
        - |
          python3 -c '
          import base64, gzip, os
          for key, dst in [
              ("pop.json.gz.b64", "/data/generation_14_population.json"),
              ("budget.py.gz.b64", "/app/hae/task/budget.py"),
              ("company.py.gz.b64", "/app/hae/runtime/company.py"),
              ("llm.py.gz.b64", "/app/hae/infra/llm.py"),
              ("judge.py.gz.b64", "/app/hae/evaluation/judge.py"),
              ("benchmark.py.gz.b64", "/app/hae/evaluation/benchmark.py"),
              ("verifier.py.gz.b64", "/app/hae/task/verifier.py"),
              ("worker.py.gz.b64", "/app/hae/orchestration/worker.py"),
              ("task.json.gz.b64", "/app/configs/tasks/self-hosting-fullstack-iter5.json"),
              ("ref_artifacts.py.gz.b64", "/app/hae/evaluation/artifacts.py"),
              ("ref_harness.py.gz.b64", "/app/hae/evaluation/harness.py"),
              ("ref_verification_loop.py.gz.b64", "/app/hae/evaluation/verification_loop.py"),
              ("ref_morphogenesis.py.gz.b64", "/app/hae/genome/morphogenesis.py"),
              ("test_artifacts.py.gz.b64", "/app/tests/test_artifacts.py"),
              ("test_execution_harness.py.gz.b64", "/app/tests/test_execution_harness.py"),
              ("test_verification_loop.py.gz.b64", "/app/tests/test_verification_loop.py"),
              ("test_morphogenesis.py.gz.b64", "/app/tests/test_morphogenesis.py"),
          ]:
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              raw = open(f"/pop-cm/{key}").read().strip()
              open(dst, "wb").write(gzip.decompress(base64.b64decode(raw)))
          ' && \
          exec python -m hae.orchestration.worker \
            --generation 15 \
            --region us-east5 \
            --population-file /data/generation_14_population.json \
            --task-file /app/configs/tasks/self-hosting-fullstack-iter5.json \
            --output-dir /data/outputs \
            --objective "Implement the 4 core self-hosting modules of the Hierarchical Agent Evolution (HAE) engine: hae/evaluation/artifacts.py, hae/evaluation/harness.py, hae/evaluation/verification_loop.py, hae/genome/morphogenesis.py"
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "gemle-gke-dev"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-east5"
        - name: GCS_BUCKET
          value: "gemle-gke-dev-agent-evolution"
        - name: LLM_PROVIDER
          value: "vllm"
        - name: V5_TYPESAFE_PROTOCOL
          value: "1"
        - name: VLLM_BASE_URL
          value: "http://vllm-qwen38-gateway.default.svc.cluster.local:8000/v1"
        - name: VLLM_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: VLLM_MAX_TOKENS
          value: "8192"
        - name: WORKER_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: EXECUTIVE_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: JUDGE_MODEL
          value: "nvidia/Qwen3.8-Flash-Next-NVFP4"
        - name: HAE_REQUIRE_NETWORK_ISOLATION
          value: "0"
        - name: FIRM_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: workdir
          mountPath: /data
        - name: pop-cm
          mountPath: /pop-cm
      volumes:
      - name: workdir
        emptyDir: {}
      - name: pop-cm
        configMap:
          name: hae-gen15-fullstack-b64
