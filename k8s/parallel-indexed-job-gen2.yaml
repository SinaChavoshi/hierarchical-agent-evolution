apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-firms-gen2
  namespace: agent-evolution
  labels:
    app: parallel-firms-gen2
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 5
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: parallel-firms-gen2
    spec:
      serviceAccountName: agent-evolution-sa
      restartPolicy: Never
      containers:
      - name: firm-evaluator
        image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/agent-evolution-repo/agent-evolution:latest
        imagePullPolicy: Always
        command:
        - "python"
        - "-m"
        - "src.worker"
        - "--generation"
        - "2"
        - "--region"
        - "us-central1"
        - "--population-file"
        - "/app/configs/generation_2_population.json"
        - "--output-dir"
        - "/data/outputs"
        - "--objective"
        - "Design and implement the production-ready 'agent-org' platform: a Python package providing hierarchical multi-agent orchestration, OpenTelemetry observability anchors, deterministic sandbox execution, and evolutionary search. Generate clean package files including pyproject.toml, core genome models, execution runtime, and test suites."
        env:
        - name: VERTEX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: vertex-token
              key: token
              optional: true
        - name: GOOGLE_CLOUD_PROJECT
          value: "YOUR_GCP_PROJECT_ID"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: WORKER_MODEL
          value: "gemini-2.5-flash"
        - name: EXECUTIVE_MODEL
          value: "gemini-2.5-pro"
        - name: JUDGE_MODEL
          value: "gemini-2.5-pro"
        - name: GCS_BUCKET
          value: "agent-evolution-artifacts-bucket"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "3000m"
            memory: "6Gi"
        volumeMounts:
        - name: data-vol
          mountPath: /data
      volumes:
      - name: data-vol
        emptyDir: {}
