apiVersion: v1
kind: Service
metadata:
  name: qwen38-flash-next-180b-headless
  namespace: default
  labels:
    app: qwen38-flash-next-180b
spec:
  clusterIP: None
  selector:
    app: qwen38-flash-next-180b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-180b
  namespace: default
  labels:
    app: qwen38-flash-next-180b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen38-flash-next-180b
  template:
    metadata:
      labels:
        app: qwen38-flash-next-180b
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: hf-cache
          emptyDir: {}
      containers:
        - name: vllm
          image: vllm/vllm-openai:nightly
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - nvidia/Qwen3.8-Flash-Next-NVFP4
            - --served-model-name
            - nvidia/Qwen3.8-Flash-Next-NVFP4
            - Qwen/Qwen3-Coder-32B-Instruct
            - --tensor-parallel-size
            - "2"
            - --max-model-len
            - "131072"
            - --gpu-memory-utilization
            - "0.92"
            - --kv-cache-dtype
            - fp8
            - --enable-prefix-caching
            - --kv-offloading-size
            - "64"
            - --kv-offloading-backend
            - native
            - --max-num-seqs
            - "64"
            - --enforce-eager
            - --trust-remote-code
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: VLLM_USE_V1
              value: "1"
          resources:
            requests:
              cpu: "24"
              memory: "220Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "48"
              memory: "320Gi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmd-gateway-script
  namespace: default
data:
  gateway.py: |
    import asyncio
    import hashlib
    import json
    import logging
    import os
    import re
    import socket
    import time
    from collections import OrderedDict
    from aiohttp import web, ClientSession, ClientTimeout

    logging.basicConfig(level=logging.INFO, format="%(asctime)s [llm-d-gateway] %(message)s")
    logger = logging.getLogger("llmd-gateway")

    HEADLESS_SVC = os.environ.get("BACKEND_HEADLESS_SVC", "qwen38-flash-next-180b-headless")
    BACKEND_PORT = int(os.environ.get("BACKEND_PORT", "8000"))
    BOUNDED_LOAD_FACTOR = float(os.environ.get("BOUNDED_LOAD_FACTOR", "1.35"))
    MAX_RESPONSE_CACHE_ENTRIES = int(os.environ.get("MAX_RESPONSE_CACHE_ENTRIES", "4096"))

    # Regex to strip company-instance identifiers (e.g., gen_9_elite_1, gen_10_crossover_2, firm_3)
    # so identical questions from different companies hit the exact same global llm-d cache entry.
    COMPANY_ID_RE = re.compile(r"\b(?:gen_\d+_[a-z0-9_]+|firm_\d+|company_[a-z0-9_]+)\b", re.IGNORECASE)

    stats = {
        "total_requests": 0,
        "short_circuit_cache_hits": 0,
        "singleflight_coalesced_hits": 0,
        "prefix_kv_affinity_hits": 0,
        "load_spillovers": 0,
        "cached_unique_answers": 0,
        "per_backend_inflight": {},
        "per_backend_total": {},
        "backends": [],
    }

    # Global cross-company response cache: canonical_prompt_hash -> (status, body_bytes, headers_dict)
    response_cache: OrderedDict[str, tuple[int, bytes, dict]] = OrderedDict()
    # In-flight singleflight futures: canonical_prompt_hash -> asyncio.Future
    inflight_futures: dict[str, asyncio.Future] = {}

    async def discover_backends():
        while True:
            try:
                loop = asyncio.get_running_loop()
                infos = await loop.getaddrinfo(HEADLESS_SVC, BACKEND_PORT, proto=socket.IPPROTO_TCP)
                ips = sorted(list({info[4][0] for info in infos}))
                backends = [f"http://{ip}:{BACKEND_PORT}" for ip in ips]
                if backends != stats["backends"]:
                    logger.info(f"Discovered {len(backends)} active vLLM KV-cache replicas: {backends}")
                    stats["backends"] = backends
                    for b in backends:
                        stats["per_backend_inflight"].setdefault(b, 0)
                        stats["per_backend_total"].setdefault(b, 0)
            except Exception as e:
                logger.warning(f"Backend DNS discovery warning: {e}")
            await asyncio.sleep(5)

    def normalize_cross_company_text(text: str) -> str:
        return COMPANY_ID_RE.sub("<SHARED_COMPANY>", text).strip()

    def extract_canonical_keys(payload_bytes: bytes) -> tuple[str, str, bool]:
        """
        Returns (full_question_key, shared_prefix_key, is_cacheable_completion).
        All companies share the SAME global session — no X-Company-ID partitioning.
        """
        try:
            data = json.loads(payload_bytes.decode("utf-8", errors="ignore"))
            if data.get("stream", False):
                raw_hash = hashlib.sha256(payload_bytes).hexdigest()
                return raw_hash, raw_hash[:32], False

            msgs = data.get("messages", [])
            if msgs:
                norm_msgs = []
                prefix_parts = []
                for idx, m in enumerate(msgs):
                    role = m.get("role", "user")
                    content = m.get("content", "")
                    if isinstance(content, str):
                        norm_content = normalize_cross_company_text(content)
                    else:
                        norm_content = json.dumps(content, sort_keys=True)
                    norm_msgs.append(f"{role}:{norm_content}")
                    if idx < 2:
                        prefix_parts.append(norm_content[:512])
                full_str = "||".join(norm_msgs)
                full_key = hashlib.sha256(full_str.encode("utf-8")).hexdigest()
                prefix_str = "||".join(prefix_parts) if prefix_parts else full_str[:512]
                prefix_key = hashlib.sha256(prefix_str.encode("utf-8")).hexdigest()
                return full_key, prefix_key, True

            prompt = data.get("prompt", "")
            if isinstance(prompt, str) and prompt:
                norm_p = normalize_cross_company_text(prompt)
                full_key = hashlib.sha256(norm_p.encode("utf-8")).hexdigest()
                prefix_key = hashlib.sha256(norm_p[:512].encode("utf-8")).hexdigest()
                return full_key, prefix_key, True
        except Exception:
            pass
        fallback = hashlib.sha256(payload_bytes).hexdigest()
        return fallback, fallback[:32], False

    def select_backend(prefix_key: str) -> str:
        backends = stats["backends"]
        if not backends:
            return f"http://{HEADLESS_SVC}:{BACKEND_PORT}"
        if len(backends) == 1:
            stats["prefix_kv_affinity_hits"] += 1
            return backends[0]

        scored = []
        for b in backends:
            h = hashlib.sha256(f"{prefix_key}@{b}".encode("utf-8")).hexdigest()
            scored.append((int(h[:16], 16), b))
        scored.sort(reverse=True)

        total_inflight = sum(stats["per_backend_inflight"].get(b, 0) for b in backends)
        avg_load = total_inflight / float(len(backends))
        max_allowed = max(4.0, (avg_load * BOUNDED_LOAD_FACTOR) + 3.0)

        primary = scored[0][1]
        if stats["per_backend_inflight"].get(primary, 0) <= max_allowed:
            stats["prefix_kv_affinity_hits"] += 1
            return primary

        for _, candidate in scored[1:]:
            if stats["per_backend_inflight"].get(candidate, 0) <= max_allowed:
                stats["load_spillovers"] += 1
                return candidate

        return min(backends, key=lambda b: stats["per_backend_inflight"].get(b, 0))

    async def handle_stats(request: web.Request):
        stats["cached_unique_answers"] = len(response_cache)
        return web.json_response(stats)

    def prepare_backend_payload(payload_bytes: bytes) -> bytes:
        try:
            data = json.loads(payload_bytes.decode("utf-8", errors="ignore"))
            if isinstance(data, dict) and "messages" in data:
                # Default to fast, low-noise non-thinking mode on Qwen3.8-Flash-Next-NVFP4 unless explicitly overridden
                ct_kwargs = data.get("chat_template_kwargs") or {}
                if "enable_thinking" not in ct_kwargs:
                    ct_kwargs["enable_thinking"] = False
                    data["chat_template_kwargs"] = ct_kwargs
                # Allow generous output tokens on 131,072 context window
                if data.get("max_tokens", 0) == 4096:
                    data["max_tokens"] = 8192
                return json.dumps(data).encode("utf-8")
        except Exception:
            pass
        return payload_bytes

    def strip_residual_thinking(resp_body: bytes) -> bytes:
        try:
            data = json.loads(resp_body.decode("utf-8", errors="ignore"))
            changed = False
            for choice in data.get("choices", []):
                msg = choice.get("message", {})
                content = msg.get("content")
                if isinstance(content, str) and "</think>" in content:
                    msg["content"] = content.split("</think>", 1)[-1].strip()
                    changed = True
            if changed:
                return json.dumps(data).encode("utf-8")
        except Exception:
            pass
        return resp_body

    async def handle_proxy(request: web.Request):
        raw_body = await request.read()
        stats["total_requests"] += 1

        is_completion_endpoint = request.path.endswith("/completions")
        body = prepare_backend_payload(raw_body) if is_completion_endpoint else raw_body
        full_key, prefix_key, is_cacheable = extract_canonical_keys(body)

        # 1. Global Cross-Company Answer Short-Circuit Check
        if is_completion_endpoint and is_cacheable:
            if full_key in response_cache:
                response_cache.move_to_end(full_key)
                cached_status, cached_body, cached_headers = response_cache[full_key]
                stats["short_circuit_cache_hits"] += 1
                out_headers = dict(cached_headers)
                out_headers["X-LLMD-Cache"] = "HIT-SHORT-CIRCUIT"
                return web.Response(status=cached_status, body=cached_body, headers=out_headers)

            # 2. Global Cross-Company Singleflight In-Flight Coalescing
            if full_key in inflight_futures:
                stats["singleflight_coalesced_hits"] += 1
                try:
                    c_status, c_body, c_headers = await asyncio.shield(inflight_futures[full_key])
                    out_headers = dict(c_headers)
                    out_headers["X-LLMD-Cache"] = "HIT-SINGLEFLIGHT-COALESCED"
                    return web.Response(status=c_status, body=c_body, headers=out_headers)
                except Exception:
                    pass

            loop = asyncio.get_running_loop()
            fut = loop.create_future()
            inflight_futures[full_key] = fut
        else:
            fut = None

        # 3. Shared Content-Prefix KV-Cache Routing across vLLM Replicas
        backend = select_backend(prefix_key)
        stats["per_backend_inflight"][backend] = stats["per_backend_inflight"].get(backend, 0) + 1
        stats["per_backend_total"][backend] = stats["per_backend_total"].get(backend, 0) + 1

        target_url = f"{backend}{request.path_qs}"
        session: ClientSession = request.app["client_session"]
        try:
            headers = {k: v for k, v in request.headers.items() if k.lower() not in ("host", "content-length")}
            async with session.request(
                method=request.method,
                url=target_url,
                headers=headers,
                data=body,
            ) as resp:
                resp_body = await resp.read()
                if is_completion_endpoint and resp.status == 200:
                    resp_body = strip_residual_thinking(resp_body)
                out_headers = {
                    k: v for k, v in resp.headers.items()
                    if k.lower() not in ("transfer-encoding", "content-encoding", "content-length")
                }
                out_headers["X-LLMD-Backend"] = backend
                out_headers["X-LLMD-Cache"] = "MISS-COMPUTED"

                if is_completion_endpoint and is_cacheable and resp.status == 200 and len(resp_body) > 32:
                    response_cache[full_key] = (resp.status, resp_body, dict(out_headers))
                    if len(response_cache) > MAX_RESPONSE_CACHE_ENTRIES:
                        response_cache.popitem(last=False)
                    stats["cached_unique_answers"] = len(response_cache)
                    if fut is not None and not fut.done():
                        fut.set_result((resp.status, resp_body, dict(out_headers)))
                elif fut is not None and not fut.done():
                    fut.set_exception(RuntimeError(f"Non-200 response: {resp.status}"))

                return web.Response(status=resp.status, body=resp_body, headers=out_headers)
        except Exception as e:
            if fut is not None and not fut.done():
                fut.set_exception(e)
            raise
        finally:
            if fut is not None:
                inflight_futures.pop(full_key, None)
            stats["per_backend_inflight"][backend] = max(0, stats["per_backend_inflight"].get(backend, 1) - 1)

    async def on_startup(app: web.Application):
        timeout = ClientTimeout(total=900)
        app["client_session"] = ClientSession(timeout=timeout)
        app["discovery_task"] = asyncio.create_task(discover_backends())

    async def on_cleanup(app: web.Application):
        app["discovery_task"].cancel()
        await app["client_session"].close()

    app = web.Application(client_max_size=64 * 1024 * 1024)
    app.on_startup.append(on_startup)
    app.on_cleanup.append(on_cleanup)
    app.router.add_get("/llmd/stats", handle_stats)
    app.router.add_route("*", "/{tail:.*}", handle_proxy)

    if __name__ == "__main__":
        web.run_app(app, host="0.0.0.0", port=8000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-inference-gateway
  namespace: default
  labels:
    app: llmd-inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmd-inference-gateway
  template:
    metadata:
      labels:
        app: llmd-inference-gateway
    spec:
      volumes:
        - name: gateway-script
          configMap:
            name: llmd-gateway-script
      containers:
        - name: router
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - pip install --no-cache-dir aiohttp && python3 /app/gateway.py
          env:
            - name: BACKEND_HEADLESS_SVC
              value: qwen38-flash-next-180b-headless
            - name: BACKEND_PORT
              value: "8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: gateway-script
              mountPath: /app
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen38-gateway
  namespace: default
spec:
  selector:
    app: llmd-inference-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
