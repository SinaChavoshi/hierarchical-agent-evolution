apiVersion: batch/v1
kind: Job
metadata:
  name: hae-gen10-qwen3-coder
  namespace: default
  labels:
    app: hae-gen10-qwen3-coder
    hae.generation: "10"
    hae.experiment-set: v4-qwen3-coder
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 5
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: hae-gen10-qwen3-coder
        hae.generation: "10"
    spec:
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: firm-evaluator
        image: us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:v4-qwen3-coder
        imagePullPolicy: Always
        command:
        - "python"
        - "-m"
        - "hae.orchestration.worker"
        - "--generation"
        - "10"
        - "--region"
        - "us-east5"
        - "--population-file"
        - "/app/configs/generation_9_population.json"
        - "--task-file"
        - "/app/configs/tasks/self-hosting-morphogenesis-iter10.json"
        - "--output-dir"
        - "/data/outputs"
        - "--objective"
        - "Implement the module hae/genome/morphogenesis.py"
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "gemle-gke-dev"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-east5"
        - name: GCS_BUCKET
          value: "chavoshi-agent-evolution-results-999225737877"
        - name: LLM_PROVIDER
          value: "vllm"
        - name: VLLM_BASE_URL
          value: "http://qwen3-coder-32b.default.svc.cluster.local:8000/v1"
        - name: VLLM_MODEL
          value: "Qwen3-Coder-32B"
        - name: WORKER_MODEL
          value: "Qwen3-Coder-32B"
        - name: EXECUTIVE_MODEL
          value: "Qwen3-Coder-32B"
        - name: JUDGE_MODEL
          value: "Qwen3-Coder-32B"
        - name: HAE_REQUIRE_NETWORK_ISOLATION
          value: "0"
        - name: FIRM_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: workdir
          mountPath: /data
      volumes:
      - name: workdir
        emptyDir: {}
