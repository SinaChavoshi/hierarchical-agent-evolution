apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-firms-west1
  namespace: agent-evolution
  labels:
    app: parallel-firms-west1
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 5
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: parallel-firms-west1
    spec:
      serviceAccountName: agent-evolution-sa
      restartPolicy: Never
      containers:
      - name: firm-evaluator
        image: us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:latest
        imagePullPolicy: Always
        command:
        - "python"
        - "-m"
        - "src.worker"
        - "--generation"
        - "0"
        - "--region"
        - "us-west1"
        - "--output-dir"
        - "/data/outputs"
        - "--objective"
        - "Design and implement the production-ready 'agent-org' platform: a Python package providing hierarchical multi-agent orchestration, OpenTelemetry observability anchors, deterministic sandbox execution, and evolutionary search. Generate clean package files including pyproject.toml, core genome models, execution runtime, and test suites."
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "gemle-gke-dev"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-west1"
        - name: WORKER_MODEL
          value: "gemini-2.5-flash"
        - name: EXECUTIVE_MODEL
          value: "gemini-2.5-pro"
        - name: JUDGE_MODEL
          value: "gemini-2.5-pro"
        - name: GCS_BUCKET
          value: "gemle-gke-dev-agent-evolution"
        resources:
          requests:
            cpu: "1500m"
            memory: "3Gi"
          limits:
            cpu: "3000m"
            memory: "6Gi"
        volumeMounts:
        - name: data-vol
          mountPath: /data
      volumes:
      - name: data-vol
        emptyDir: {}
