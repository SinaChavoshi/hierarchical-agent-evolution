  <rect x="984" y="146" width="412" height="30" rx="6" fill="#059669"/>
  <text x="1190" y="166" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">ERA 3 (V13 + BEAM-501B): HIERARCHICAL AB-MCTS + DFLASH2</text>
  <text x="988" y="196" fill="#a7f3d0" font-size="12" font-weight="700">&#8226; V13: 3-Layer Context Isolation (L0 Contract &#8594; L1-A &#8594; L2 &#8594; L1-B)</text>
  <text x="988" y="218" fill="#e2e8f0" font-size="12">&#8226; Agentic AB-MCTS over Git Diffs: CONT Delta-Refiner + GEN "Move 37"</text>
  <text x="988" y="240" fill="#e2e8f0" font-size="12">&#8226; Popperian AdversarialFalsifierSubAgent eliminates self-oracle bias</text>
  <text x="988" y="262" fill="#e2e8f0" font-size="12">&#8226; Reflection Beam-1.0-501B-A23B + DFlash2 (3x Ray TP=4, 12x 96GB GPUs)</text>
