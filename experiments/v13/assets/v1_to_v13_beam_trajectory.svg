  <rect width="1440" height="860" fill="url(#bgGrad3)"/>

  <!-- Header Banner -->
  <rect x="28" y="20" width="1384" height="92" rx="16" fill="url(#hdrGrad3)" stroke="#34d399" stroke-width="2" filter="url(#shadow3)"/>
  <text x="54" y="55" fill="#ffffff" font-size="23" font-weight="800" letter-spacing="0.3">HAE MULTI-GENERATION EVOLUTIONARY TRAJECTORY (V1 &#8594; V13 + REFLECTION BEAM-1.0-501B)</text>
  <text x="54" y="82" fill="#d1fae5" font-size="13.5" font-weight="500">Three Architectural Eras: From Execution-Grounded Fitness (V1&#8211;V7) to SWE-bench ReAct (V8&#8211;V12) to Hierarchical AB-MCTS + Beam-501B (V13)</text>

  <!-- ===================================================================== -->
  <!-- TOP SECTION: THREE ARCHITECTURAL ERAS TIMELINE                        -->
  <!-- ===================================================================== -->
  <!-- Era 1 Card -->
  <rect x="28" y="132" width="442" height="190" rx="14" fill="#0f172a" stroke="#14b8a6" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="44" y="146" width="410" height="30" rx="6" fill="#0f766e"/>
  <text x="249" y="166" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">ERA 1 (V1&#8211;V7): EXECUTION-GROUNDED &amp; EPISTEMIC FOUNDATIONS</text>
  <text x="48" y="196" fill="#99f6e4" font-size="12" font-weight="700">&#8226; V1 &#8594; V2: Prose LLM Judge (0/60 exec) &#8594; Pytest Sandbox (30/30 at 7/7)</text>
  <text x="48" y="218" fill="#e2e8f0" font-size="12">&#8226; V3 &#8594; V4: Self-hosted Qwen3.8-180B MoE + llm-d Prefix-Affinity (0.74 ms)</text>
  <text x="48" y="240" fill="#e2e8f0" font-size="12">&#8226; V5: xgrammar JSON Packets (-91.9% output tokens, 50/50 full_stack_hae)</text>
  <text x="48" y="262" fill="#e2e8f0" font-size="12">&#8226; V6 &#8594; V7: EpistemicState Ledger, EvidenceGatekeeper &amp; OOF Value Heads</text>
  <text x="48" y="294" fill="#2dd4bf" font-size="12" font-weight="800">Outcome: 100% (7/7 &amp; 50/50) on Internal Multi-Module Benchmarks</text>

  <!-- Era 2 Card -->
  <rect x="498" y="132" width="442" height="190" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="514" y="146" width="410" height="30" rx="6" fill="#d97706"/>
  <text x="719" y="166" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">ERA 2 (V8&#8211;V12): SWE-BENCH HARNESS &amp; AGENTIC REACT</text>
  <text x="518" y="196" fill="#fde68a" font-size="12" font-weight="700">&#8226; V8: Official Containerized SWE-bench Dev Cohort (4/30 = 13.3%)</text>
  <text x="518" y="218" fill="#e2e8f0" font-size="12">&#8226; V9 &#8594; V10: Packet AB-MCTS + MoE Expert Parallelism &amp; EPLB (5/30 = 16.7%)</text>
  <text x="518" y="240" fill="#e2e8f0" font-size="12">&#8226; V11: Multi-Hunk Splicing &amp; Corroboration (6/30 = 20.0% packet ceiling)</text>
  <text x="518" y="262" fill="#e2e8f0" font-size="12">&#8226; V12: Interactive ReAct Loop + Best-of-3 Framing (14/30 = 46.7%, 98 F2P)</text>
  <text x="518" y="294" fill="#fbbf24" font-size="12" font-weight="800">Outcome: 2.33x Jump to 46.7% (Exposed Single-Context Local Optima)</text>

  <!-- Era 3 Card -->
