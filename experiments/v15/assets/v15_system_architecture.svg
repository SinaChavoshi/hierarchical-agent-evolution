<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d">
  <title id="t">HAE V15 system architecture</title>
  <desc id="d">The V15 evolution loop breeds harness genomes and evaluates them. Each genome runs the hierarchical harness against a task. Tool calls run in SWE-bench sandbox pods; every LLM call goes through the llm-d router, which picks one of three Beam-501B replicas by prefix-cache affinity, queue depth and KV-cache use.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .band { font-size: 16px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .t { font-size: 12.5px; fill: #334155; }
    .s { font-size: 12px; fill: #475569; }
    .lbl { font-size: 12px; fill: #475569; font-style: italic; }
    .box { fill: #ffffff; stroke-width: 1.2; }
  </style>

  <rect x="0" y="0" width="1200" height="880" rx="16" fill="#ffffff"/>

  <!-- ① Evolution loop -->
  <rect x="20" y="20" width="1160" height="210" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="40" y="44" class="band" style="fill:#5b21b6">① Evolution loop (V15) · evolves the harness itself</text>

  <path d="M1060,66 L1060,58 L140,58 L140,64" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
  <rect x="690" y="49" width="230" height="18" fill="#f5f3ff"/>
  <text x="805" y="62" text-anchor="middle" class="lbl" style="fill:#6d28d9">next generation is bred from the elites</text>

  <g>
    <rect class="box" x="40" y="66" width="200" height="84" rx="9" stroke="#a78bfa"/>
    <text x="140" y="92" text-anchor="middle" class="h">Population</text>
    <text x="140" y="114" text-anchor="middle" class="t">8 harness genomes</text>
    <text x="140" y="134" text-anchor="middle" class="t">18 knobs + a code patch</text>

    <rect class="box" x="270" y="66" width="200" height="84" rx="9" stroke="#a78bfa"/>
    <text x="370" y="92" text-anchor="middle" class="h">Breed</text>
    <text x="370" y="114" text-anchor="middle" class="t">code mutation by meta-model</text>
    <text x="370" y="134" text-anchor="middle" class="t">knob mutation · crossover</text>

    <rect class="box" x="500" y="66" width="200" height="84" rx="9" stroke="#a78bfa"/>
    <text x="600" y="92" text-anchor="middle" class="h">Safety gates</text>
    <text x="600" y="114" text-anchor="middle" class="t">leakage check · compile</text>
    <text x="600" y="134" text-anchor="middle" class="t">harness unit tests</text>

    <rect class="box" x="730" y="66" width="200" height="84" rx="9" stroke="#a78bfa"/>
    <text x="830" y="92" text-anchor="middle" class="h">Evaluate</text>
    <text x="830" y="114" text-anchor="middle" class="t">all on 6 stage-1 tasks</text>
    <text x="830" y="134" text-anchor="middle" class="t">top 3 on 21 train tasks</text>

    <rect class="box" x="960" y="66" width="200" height="84" rx="9" stroke="#a78bfa"/>
    <text x="1060" y="92" text-anchor="middle" class="h">Select elites</text>
    <text x="1060" y="114" text-anchor="middle" class="t">resolve rate + partial</text>
    <text x="1060" y="134" text-anchor="middle" class="t">credit − token cost</text>

    <line x1="240" y1="108" x2="268" y2="108" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
    <line x1="470" y1="108" x2="498" y2="108" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
    <line x1="700" y1="108" x2="728" y2="108" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
    <line x1="930" y1="108" x2="958" y2="108" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
  </g>
  <text x="40" y="186" class="s">Held out from evolution:</text>
  <text x="40" y="206" class="s">10 validation tasks pick the winner · 28 SWE-bench Verified test tasks are run once, at the end.</text>
  <text x="40" y="224" class="s">Controls: random search at equal budget, the hand-designed seed, and flat ReAct.</text>

  <!-- ② Harness -->
  <rect x="20" y="250" width="1160" height="270" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="276" class="band" style="fill:#1e40af">② Harness under test · one genome on one task</text>

  <rect x="40" y="292" width="1120" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="56" y="317" class="t"><tspan style="font-weight:700;fill:#1e3a8a">L0-Macro ratchet</tspan> (multi-file builds): a planner splits the spec into a milestone DAG; each certified milestone is committed and tagged, so every step works on a small diff.</text>

  <g>
    <rect class="box" x="40" y="352" width="250" height="92" rx="9" stroke="#60a5fa"/>
    <text x="165" y="378" text-anchor="middle" class="h">L1-A · Recon</text>
    <text x="165" y="400" text-anchor="middle" class="t">locates the fault and writes</text>
    <text x="165" y="420" text-anchor="middle" class="t">a failing repro script</text>

    <rect class="box" x="330" y="352" width="250" height="92" rx="9" stroke="#60a5fa"/>
    <text x="455" y="378" text-anchor="middle" class="h">L0 · Controller</text>
    <text x="455" y="400" text-anchor="middle" class="t">writes the contract; AB-MCTS picks</text>
    <text x="455" y="420" text-anchor="middle" class="t">GEN (new branch) or CONT (refine)</text>

    <rect class="box" x="620" y="352" width="250" height="92" rx="9" stroke="#60a5fa"/>
    <text x="745" y="378" text-anchor="middle" class="h">L2 · Executors</text>
    <text x="745" y="400" text-anchor="middle" class="t">fresh-context ReAct in /testbed</text>
    <text x="745" y="420" text-anchor="middle" class="t">view · bash · str_replace · submit</text>

    <rect class="box" x="910" y="352" width="250" height="92" rx="9" stroke="#60a5fa"/>
    <text x="1035" y="378" text-anchor="middle" class="h">L1-B · Verifier</text>
    <text x="1035" y="400" text-anchor="middle" class="t">A: compile, repro, target tests</text>
    <text x="1035" y="420" text-anchor="middle" class="t">B: read-only falsifier agent</text>

    <line x1="290" y1="398" x2="328" y2="398" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
    <line x1="580" y1="398" x2="618" y2="398" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
    <line x1="870" y1="398" x2="908" y2="398" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
    <path d="M1035,444 L1035,466 L455,466 L455,446" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
  </g>
  <text x="745" y="488" text-anchor="middle" class="lbl" style="fill:#1e40af">score V and critique update the controller's Beta posteriors</text>
  <text x="745" y="506" text-anchor="middle" class="lbl" style="fill:#1e40af">V = 1.0 → patch accepted (or milestone committed)</text>

  <!-- ③ Cluster -->
  <rect x="20" y="540" width="1160" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="566" class="band" style="fill:#334155">③ GKE cluster</text>

  <!-- CPU pool -->
  <rect x="40" y="585" width="330" height="255" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="610" class="h" style="fill:#334155">CPU pool · e2-standard-8</text>
  <rect class="box" x="56" y="626" width="298" height="86" rx="8" stroke="#94a3b8"/>
  <text x="205" y="652" text-anchor="middle" class="h">SWE-bench sandbox pods</text>
  <text x="205" y="674" text-anchor="middle" class="t">official task image, one /testbed</text>
  <text x="205" y="694" text-anchor="middle" class="t">per genome × task</text>
  <line x1="205" y1="712" x2="205" y2="726" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect class="box" x="56" y="728" width="298" height="96" rx="8" stroke="#94a3b8"/>
  <text x="205" y="754" text-anchor="middle" class="h">Grader (not evolvable)</text>
  <text x="205" y="776" text-anchor="middle" class="t">runs FAIL_TO_PASS / PASS_TO_PASS</text>
  <text x="205" y="796" text-anchor="middle" class="t">→ grade.json → fitness</text>

  <!-- llm-d -->
  <rect x="400" y="585" width="380" height="255" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="416" y="610" class="h" style="fill:#115e59">llm-d router v1.0.0 · standalone</text>
  <rect class="box" x="416" y="626" width="348" height="56" rx="8" stroke="#2dd4bf"/>
  <text x="590" y="650" text-anchor="middle" class="h">Envoy proxy · :8000</text>
  <text x="590" y="670" text-anchor="middle" class="t">OpenAI-compatible entry point</text>
  <line x1="590" y1="682" x2="590" y2="696" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <rect class="box" x="416" y="698" width="348" height="130" rx="8" stroke="#2dd4bf"/>
  <text x="590" y="721" text-anchor="middle" class="h">Endpoint Picker (EPP)</text>
  <text x="432" y="744" class="t">scores every replica, per request:</text>
  <text x="432" y="764" class="t">· prefix-cache ×3 → replica with the warm KV</text>
  <text x="432" y="782" class="t">· queue depth ×2 → fewest waiting requests</text>
  <text x="432" y="800" class="t">· KV-cache use ×2 → most free KV cache</text>
  <text x="432" y="820" class="s">reads each vLLM /metrics · InferencePool = Ray heads</text>

  <!-- GPU pool -->
  <rect x="810" y="585" width="350" height="255" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="826" y="610" class="h" style="fill:#92400e">GPU pool · 6× g4-standard-96</text>
  <text x="826" y="628" class="s">12× RTX PRO 6000 Blackwell (96 GB each)</text>
  <rect class="box" x="826" y="642" width="318" height="56" rx="8" stroke="#f59e0b"/>
  <text x="985" y="665" text-anchor="middle" class="h">Beam replica 0 · TP=4 on 2 nodes</text>
  <text x="985" y="685" text-anchor="middle" class="t">vLLM · prefix caching · DFlash2</text>
  <rect class="box" x="826" y="708" width="318" height="56" rx="8" stroke="#f59e0b"/>
  <text x="985" y="731" text-anchor="middle" class="h">Beam replica 1 · TP=4 on 2 nodes</text>
  <text x="985" y="751" text-anchor="middle" class="t">vLLM · prefix caching · DFlash2</text>
  <rect class="box" x="826" y="774" width="318" height="56" rx="8" stroke="#f59e0b"/>
  <text x="985" y="797" text-anchor="middle" class="h">Beam replica 2 · TP=4 on 2 nodes</text>
  <text x="985" y="817" text-anchor="middle" class="t">vLLM · prefix caching · DFlash2</text>

  <line x1="764" y1="750" x2="824" y2="672" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <line x1="764" y1="760" x2="824" y2="736" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <line x1="764" y1="770" x2="824" y2="800" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <!-- Evaluate -> harness -->
  <line x1="830" y1="150" x2="830" y2="290" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="842" y="182" class="lbl">runs the genome's own</text>
  <text x="842" y="198" class="lbl">git worktree with its knobs</text>

  <!-- harness -> cluster -->
  <line x1="330" y1="520" x2="330" y2="624" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="340" y="556" class="lbl">kubectl exec:</text>
  <text x="340" y="572" class="lbl">tools and tests</text>
  <line x1="700" y1="520" x2="700" y2="624" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <text x="710" y="556" class="lbl" style="fill:#0f766e">every LLM call (OpenAI API):</text>
  <text x="710" y="572" class="lbl" style="fill:#0f766e">all harness layers + the meta-model</text>

</svg>
