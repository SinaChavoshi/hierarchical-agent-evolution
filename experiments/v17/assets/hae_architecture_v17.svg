<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="t d">
  <title id="t">Hierarchical Agent Evolution (HAE V15–V17) System Architecture</title>
  <desc id="d">Three-tier architecture of HAE on GKE: (1) Evolution and Company DNA loop breeding knobs, code patches, one-line role playbooks, UCB CEO policy, and 11 Red-Team and Blackboard genes under AST/token leakage gates and verdict confusion-matrix fitness; (2) Hierarchical AB-MCTS harness with L0-Macro Git milestone ratchet, locked reproduction tests, Move 37 upstream causal branching, typed shared blackboard with budgeted Q&amp;A, and a firewalled read-only Red Team; (3) GKE sandbox pod pool, llm-d v1.0 Endpoint Picker router, and 3x TP=4 Beam-501B NVFP4 Blackwell replicas.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .band { font-size: 15.5px; font-weight: 700; }
    .h { font-size: 13.5px; font-weight: 700; }
    .t { font-size: 12px; fill: #334155; }
    .s { font-size: 11.5px; fill: #475569; }
    .lbl { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.2px; }
    .box { fill: #ffffff; stroke-width: 1.3; }
  </style>

  <!-- Crisp white background card for readability in both light and dark GitHub themes -->
  <rect x="0" y="0" width="1200" height="980" rx="16" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- ① Evolution & Company DNA Loop (V15–V17)                               -->
  <!-- ====================================================================== -->
  <rect x="20" y="16" width="1160" height="218" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="40" y="40" class="band" style="fill:#5b21b6">① Evolution &amp; "Company DNA" loop (V15–V17) · co-evolves code, roles, verification &amp; communication</text>

  <!-- Elites feedback arc -->
  <path d="M1058,66 L1058,53 L142,53 L142,64" fill="none" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#av)"/>
  <rect x="650" y="44" width="300" height="17" fill="#f5f3ff"/>
  <text x="800" y="57" text-anchor="middle" class="lbl" style="fill:#6d28d9">next generation bred from top elites + role credits</text>

  <g>
    <rect class="box" x="40" y="66" width="204" height="100" rx="9" stroke="#a78bfa"/>
    <text x="142" y="88" text-anchor="middle" class="h">Company DNA genome</text>
    <text x="142" y="108" text-anchor="middle" class="t">18 knobs + source code patch</text>
    <text x="142" y="126" text-anchor="middle" class="t">1-line role playbooks &amp; UCB CEO</text>
    <text x="142" y="144" text-anchor="middle" class="t">11 Red-Team &amp; Blackboard genes</text>

    <rect class="box" x="269" y="66" width="204" height="100" rx="9" stroke="#a78bfa"/>
    <text x="371" y="88" text-anchor="middle" class="h">Breed (pop = 8)</text>
    <text x="371" y="108" text-anchor="middle" class="t">LLM code &amp; role_rewrite</text>
    <text x="371" y="126" text-anchor="middle" class="t">redteam_mutate · redteam_rewrite</text>
    <text x="371" y="144" text-anchor="middle" class="t">mutate_ceo · knob &amp; org crossover</text>

    <rect class="box" x="498" y="66" width="204" height="100" rx="9" stroke="#a78bfa"/>
    <text x="600" y="88" text-anchor="middle" class="h">Admission gates</text>
    <text x="600" y="108" text-anchor="middle" class="t">AST/token LeakageGate</text>
    <text x="600" y="126" text-anchor="middle" class="t">repo/ID ban-list &amp; RoleGates</text>
    <text x="600" y="144" text-anchor="middle" class="t">compile + harness unit tests</text>

    <rect class="box" x="727" y="66" width="204" height="100" rx="9" stroke="#a78bfa"/>
    <text x="829" y="88" text-anchor="middle" class="h">Successive halving</text>
    <text x="829" y="108" text-anchor="middle" class="t">10 discriminative stage-1 tasks</text>
    <text x="829" y="126" text-anchor="middle" class="t">top 3 → 41 screened train tasks</text>
    <text x="829" y="144" text-anchor="middle" class="t">post-run verdict labelling (train)</text>

    <rect class="box" x="956" y="66" width="204" height="100" rx="9" stroke="#a78bfa"/>
    <text x="1058" y="88" text-anchor="middle" class="h">Select elites</text>
    <text x="1058" y="108" text-anchor="middle" class="t">resolve + 0.25× partial F2P</text>
    <text x="1058" y="126" text-anchor="middle" class="t">+ 0.30× Red-Team (2× FP penalty)</text>
    <text x="1058" y="144" text-anchor="middle" class="t">− token cost · per-verdict credit</text>

    <line x1="244" y1="116" x2="267" y2="116" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
    <line x1="473" y1="116" x2="496" y2="116" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
    <line x1="702" y1="116" x2="725" y2="116" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
    <line x1="931" y1="116" x2="954" y2="116" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#av)"/>
  </g>

  <text x="40" y="192" class="s"><tspan style="font-weight:700;fill:#4c1d95">Held-out protocol:</tspan> 10 validation tasks (2× reps) pick winner · 28 unseen SWE-bench Verified test tasks (2× reps + official container re-grade).</text>
  <text x="40" y="212" class="s"><tspan style="font-weight:700;fill:#4c1d95">Controlled arms:</tspan> permissive budget (A17) · strict Red Team (S) · +Blackboard (B17) · +Directed Q&amp;A (Q17) · Evolved (R) · Random search (Rr) · Flat ReAct (V12).</text>

  <!-- Clean inter-band connector ① -> ② -->
  <line x1="829" y1="234" x2="829" y2="264" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="817" y="254" text-anchor="end" class="lbl">runs each candidate genome in an isolated git worktree + synced org_binding</text>

  <!-- ====================================================================== -->
  <!-- ② Hierarchical AB-MCTS Harness, Blackboard & Firewalled Red Team       -->
  <!-- ====================================================================== -->
  <rect x="20" y="266" width="1160" height="352" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="40" y="291" class="band" style="fill:#1e40af">② Hierarchical AB-MCTS harness · clean-context search, milestone ratchet &amp; firewalled QA (250-move safety cap)</text>

  <!-- L0-Macro Ratchet Bar -->
  <rect x="40" y="304" width="1120" height="36" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="56" y="326" class="t"><tspan style="font-weight:700;fill:#1e3a8a">L0-Macro milestone ratchet</tspan> (greenfield / multi-file builds): topological DAG of bounded commits (≤ 600 LoC); each certified milestone locks cumulative Git-tag regression suites.</text>

  <!-- Beta Posterior Return Arc (clean corridor y=354 above the 4 layer boxes) -->
  <path d="M1039,380 L1039,358 L460,358 L460,378" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="498" y="348" width="504" height="17" fill="#eff6ff"/>
  <text x="750" y="360" text-anchor="middle" class="lbl" style="fill:#1e40af">V(s_i) updates Beta(α, β) · stagnation triggers "Move 37" GEN · V = 1.0 self-terminates</text>

  <!-- 4 Clean-Context Layers -->
  <g>
    <rect class="box" x="40" y="380" width="248" height="104" rx="9" stroke="#60a5fa"/>
    <text x="164" y="402" text-anchor="middle" class="h">L1-A · Recon &amp; Locked Repro</text>
    <text x="164" y="421" text-anchor="middle" class="t">fault brief (&lt; 800 tokens)</text>
    <text x="164" y="439" text-anchor="middle" class="t">writes .hae/reproduce_issue.py</text>
    <text x="164" y="457" text-anchor="middle" class="s" style="fill:#1d4ed8;font-weight:600">locked once failing on HEAD</text>

    <rect class="box" x="326" y="380" width="268" height="104" rx="9" stroke="#60a5fa"/>
    <text x="460" y="402" text-anchor="middle" class="h">L0 · Architect, CEO &amp; AB-MCTS</text>
    <text x="460" y="421" text-anchor="middle" class="t">Beta Thompson: CONT (refine) vs.</text>
    <text x="460" y="439" text-anchor="middle" class="t" style="fill:#1e3a8a;font-weight:600">GEN ("Move 37" upstream / symmetry)</text>
    <text x="460" y="457" text-anchor="middle" class="s">UCB CEO staffs &amp; swaps stalled roles</text>

    <rect class="box" x="632" y="380" width="248" height="104" rx="9" stroke="#60a5fa"/>
    <text x="756" y="402" text-anchor="middle" class="h">L2 · Scoped Executors</text>
    <text x="756" y="421" text-anchor="middle" class="t">fresh context per Git checkpoint</text>
    <text x="756" y="439" text-anchor="middle" class="t">view · bash · str_replace · submit</text>
    <text x="756" y="457" text-anchor="middle" class="s">returns candidate git diff s_i</text>

    <rect x="918" y="380" width="242" height="104" rx="9" fill="#fff1f2" stroke="#f87171" stroke-width="1.4"/>
    <text x="1039" y="402" text-anchor="middle" class="h" style="fill:#991b1b">L1-B · Firewalled Red Team</text>
    <text x="1039" y="421" text-anchor="middle" class="t">read-only repo (no_edit=True)</text>
    <text x="1039" y="439" text-anchor="middle" class="t">skeptic_default + evidence_tests</text>
    <text x="1039" y="457" text-anchor="middle" class="s" style="fill:#b91c1c;font-weight:600">panel 1–3 AND-gate · V ∈ [0, 1]</text>

    <line x1="288" y1="432" x2="324" y2="432" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
    <line x1="594" y1="432" x2="630" y2="432" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
    <line x1="880" y1="432" x2="916" y2="432" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
  </g>

  <!-- Vertical links between Layers and Blackboard / Firewall -->
  <line x1="164" y1="484" x2="164" y2="514" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ab)"/>
  <line x1="460" y1="516" x2="460" y2="486" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="742" y1="484" x2="742" y2="514" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="770" y1="516" x2="770" y2="486" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="1039" y1="484" x2="1039" y2="514" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Typed Shared Blackboard & Asymmetric Firewall -->
  <rect x="40" y="516" width="840" height="84" rx="9" fill="#ffffff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="58" y="538" class="h" style="fill:#3730a3">Typed Shared Blackboard (<tspan class="mono" style="fill:#3730a3">/testbed/.hae/blackboard.jsonl</tspan>) + Budgeted Directed Q&amp;A</text>
  <text x="58" y="558" class="t">Deduplicated entries (≤ 320 chars, max 32): <tspan class="mono">finding | hypothesis | ruled_out | failing_case | question | answer | decision</tspan></text>
  <text x="58" y="578" class="s">Carries upstream facts across AB-MCTS branches · wakes target role for 2-turn micro-Q&amp;A (<tspan class="mono">max_questions</tspan> cap) · stops 3× duplicate-patch loops.</text>

  <rect x="918" y="516" width="242" height="84" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="1039" y="538" text-anchor="middle" class="h" style="fill:#991b1b">Asymmetric Firewall</text>
  <text x="1039" y="558" text-anchor="middle" class="t">sees diff + facts only (no rationale)</text>
  <text x="1039" y="578" text-anchor="middle" class="s" style="fill:#991b1b">posts executable failing_case on FAIL</text>

  <line x1="918" y1="558" x2="882" y2="558" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Clean inter-band connectors ② -> ③ (in the open gutter y=618..650) -->
  <line x1="210" y1="618" x2="210" y2="648" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="222" y="638" class="lbl">kubectl exec: tools, tests &amp; container grading</text>

  <line x1="592" y1="618" x2="592" y2="648" stroke="#0f766e" stroke-width="1.7" marker-end="url(#at)"/>
  <text x="604" y="638" class="lbl" style="fill:#0f766e">OpenAI API: all harness layers + meta-model</text>

  <!-- ====================================================================== -->
  <!-- ③ GKE Cluster & llm-d v1.0 Co-Design                                   -->
  <!-- ====================================================================== -->
  <rect x="20" y="650" width="1160" height="312" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="40" y="676" class="band" style="fill:#334155">③ GKE cluster · single-use sandbox pod pool &amp; prefix-aware llm-d v1.0 serving</text>

  <!-- CPU pool -->
  <rect x="40" y="694" width="340" height="250" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="718" class="h" style="fill:#334155">CPU pool · pre-warmed sandbox pods</text>
  <rect class="box" x="56" y="732" width="308" height="84" rx="8" stroke="#94a3b8"/>
  <text x="210" y="754" text-anchor="middle" class="h">Single-use SWE-bench testbed pods</text>
  <text x="210" y="773" text-anchor="middle" class="t">official task container · 2 CPU / 6 GiB</text>
  <text x="210" y="792" text-anchor="middle" class="s">interleaved (genome, task) · never reused</text>
  <line x1="210" y1="816" x2="210" y2="830" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="56" y="832" width="308" height="96" rx="8" stroke="#94a3b8"/>
  <text x="210" y="854" text-anchor="middle" class="h">Grader &amp; verdict labeller (immutable)</text>
  <text x="210" y="874" text-anchor="middle" class="t">runs FAIL_TO_PASS &amp; PASS_TO_PASS</text>
  <text x="210" y="893" text-anchor="middle" class="t">→ grade.json + train verdicts_grade.json</text>
  <text x="210" y="912" text-anchor="middle" class="s">+ official swebench container re-grade on test</text>

  <!-- llm-d -->
  <rect x="405" y="694" width="375" height="250" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="421" y="718" class="h" style="fill:#115e59">llm-d router v1.0.0 · Gateway API Inference Ext.</text>
  <rect class="box" x="421" y="732" width="343" height="54" rx="8" stroke="#2dd4bf"/>
  <text x="592" y="754" text-anchor="middle" class="h">Envoy proxy · :8000</text>
  <text x="592" y="773" text-anchor="middle" class="t">unified OpenAI-compatible API endpoint</text>
  <line x1="592" y1="786" x2="592" y2="800" stroke="#0f766e" stroke-width="1.5" marker-end="url(#at)"/>
  <rect class="box" x="421" y="802" width="343" height="126" rx="8" stroke="#2dd4bf"/>
  <text x="592" y="823" text-anchor="middle" class="h">Endpoint Picker (EPP · tuned for 28 workers)</text>
  <text x="437" y="844" class="t">· queue-scorer ×3 → prevents replica hot-spots</text>
  <text x="437" y="863" class="t">· kv-cache-utilization ×2 → balances free KV memory</text>
  <text x="437" y="882" class="t">· prefix-cache-scorer ×1 → warm contract/blackboard KV</text>
  <text x="437" y="903" class="s" style="fill:#0f766e;font-weight:600">stable clean-context prefix → ~0.25 s follow-up TTFT</text>
  <text x="437" y="920" class="s">scrapes vLLM /metrics · InferencePool fail-open</text>

  <!-- GPU pool -->
  <rect x="805" y="694" width="355" height="250" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="821" y="718" class="h" style="fill:#92400e">GPU pool · 6× g4-standard-96</text>
  <text x="821" y="736" class="s">12× RTX PRO 6000 Blackwell (96 GB each)</text>
  <rect class="box" x="821" y="748" width="323" height="55" rx="8" stroke="#f59e0b"/>
  <text x="982" y="770" text-anchor="middle" class="h">Beam-501B-A23B (NVFP4) · replica 0</text>
  <text x="982" y="789" text-anchor="middle" class="t">vLLM TP=4 (2 nodes) · prefix cache · DFlash2</text>
  <rect class="box" x="821" y="812" width="323" height="55" rx="8" stroke="#f59e0b"/>
  <text x="982" y="834" text-anchor="middle" class="h">Beam-501B-A23B (NVFP4) · replica 1</text>
  <text x="982" y="853" text-anchor="middle" class="t">vLLM TP=4 (2 nodes) · prefix cache · DFlash2</text>
  <rect class="box" x="821" y="876" width="323" height="55" rx="8" stroke="#f59e0b"/>
  <text x="982" y="898" text-anchor="middle" class="h">Beam-501B-A23B (NVFP4) · replica 2</text>
  <text x="982" y="917" text-anchor="middle" class="t">vLLM TP=4 (2 nodes) · prefix cache · DFlash2</text>

  <line x1="764" y1="852" x2="819" y2="775" stroke="#0f766e" stroke-width="1.5" marker-end="url(#at)"/>
  <line x1="764" y1="862" x2="819" y2="839" stroke="#0f766e" stroke-width="1.5" marker-end="url(#at)"/>
  <line x1="764" y1="872" x2="819" y2="904" stroke="#0f766e" stroke-width="1.5" marker-end="url(#at)"/>

</svg>
