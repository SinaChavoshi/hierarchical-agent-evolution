    <line x1="420" y1="0" x2="420" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="420" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 1 Evolved</text>
    <text x="420" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="middle">3-Way Breeding (312)</text>

