    <text x="90" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 0 Baseline</text>
    <text x="90" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="middle">Seed Enterprise (31)</text>

    <!-- Milestone 2: Gen 0 Parallel Tournament (x=250) -->
    <line x1="250" y1="0" x2="250" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="250" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 0 Tournament</text>
    <text x="250" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="middle">10 Firms (310)</text>

