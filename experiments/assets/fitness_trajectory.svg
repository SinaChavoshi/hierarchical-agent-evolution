<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Track A Gradients (Cyan to Sky) -->
    <linearGradient id="trackAGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="trackAArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Track B Gradients (Fuchsia to Emerald Surge) -->
    <linearGradient id="trackBGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="trackBArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="556" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(48, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">
      Generational Fitness Trajectory &amp; Sandbox Convergence
    </text>
    <text x="0" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
      Empirical convergence between unconstrained semantic reasoning and grounded deterministic sandbox execution across 4 generations
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 36)">
    <!-- Track A Legend -->
    <line x1="0" y1="8" x2="24" y2="8" stroke="url(#trackAGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
    <circle cx="12" cy="8" r="3.5" fill="#38bdf8" />
    <text x="32" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">
      Raw Semantic Frontier (Pre-Penalty)
    </text>

    <!-- Track B Legend -->
    <line x1="0" y1="28" x2="24" y2="28" stroke="url(#trackBGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="12" cy="28" r="4.5" fill="#10b981" />
    <text x="32" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
      Grounded Sandbox Score (Final Benchmark)
    </text>
  </g>

  <!-- Chart Grid Area (x: 80 to 880, y: 105 to 385) -->
  <g transform="translate(80, 105)">
    <!-- Horizontal Grid Lines & Y-Labels (280px total height, 7px per pt) -->
    <!-- 100 pts -->
    <line x1="0" y1="0" x2="800" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-14" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">100</text>

    <!-- 90 pts (y=70) -->
    <line x1="0" y1="70" x2="800" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-14" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">90</text>

    <!-- 80 pts (y=140) -->
    <line x1="0" y1="140" x2="800" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-14" y="144" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">80</text>

    <!-- 70 pts (y=210) -->
    <line x1="0" y1="210" x2="800" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-14" y="214" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">70</text>

    <!-- 60 pts (y=280) -->
    <line x1="0" y1="280" x2="800" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-14" y="284" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">60</text>

    <!-- Vertical Milestone Markers -->
    <!-- Milestone 1: Gen 0 Baseline (x=110) -->
    <line x1="110" y1="0" x2="110" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 0 Baseline</text>
    <text x="110" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle">Seed Enterprise (31)</text>

    <!-- Milestone 2: Gen 0 Parallel Tournament (x=320) -->
    <line x1="320" y1="0" x2="320" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="320" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 0 Tournament</text>
    <text x="320" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle">10 Firms (310 Agents)</text>

    <!-- Milestone 3: Gen 1 Parallel Tournament (x=530) -->
    <line x1="530" y1="0" x2="530" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="530" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 1 Evolved</text>
    <text x="530" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle">3-Way Breeding (312)</text>

    <!-- Milestone 4: Gen 2 Persona Discretization (x=730) -->
    <line x1="730" y1="0" x2="730" y2="280" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
    <text x="730" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Gen 2 Breakthrough</text>
    <text x="730" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#10b981" text-anchor="middle">Discretized Traits (314)</text>

    <!-- Penalty Disconnect Shading between x=320 and x=530 -->
    <path d="M 320 26.25 L 530 19.6 L 530 164.15 L 320 157.5 Z" fill="#e11d48" fill-opacity="0.10" />

    <!-- Track A: Raw Semantic Frontier (Dashed line) -->
    <!-- Points: (110, 49) [93.00], (320, 26.25) [96.25], (530, 19.6) [97.20], (730, 38.5) [94.50] -->
    <path d="M 110 49 C 210 32, 260 27, 320 26.25 C 410 24, 470 20, 530 19.6 C 610 19, 670 32, 730 38.5" 
          fill="none" stroke="url(#trackAGrad)" stroke-width="2.5" stroke-dasharray="5 3" />

    <circle cx="110" cy="49" r="4" fill="#10b981" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="320" cy="26.25" r="4" fill="#06b6d4" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="530" cy="19.6" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />

    <!-- Track B: Grounded Sandbox Execution Area & Curve -->
    <!-- Points: (320, 157.5) [77.50], (530, 164.15) [76.55], (730, 38.5) [94.50] -->
    <polygon points="320,157.5 530,164.15 730,38.5 730,280 320,280" fill="url(#trackBArea)" />
    <path d="M 320 157.5 C 410 160, 480 165, 530 164.15 C 600 162, 660 65, 730 38.5" 
          fill="none" stroke="url(#trackBGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Track B Milestone Spreads & Nodes -->
    <!-- Gen 0 Parallel Spread (x=320): Champion 77.50 (y=157.5), Mean 71.37 (y=200.4), Floor 71.25 (y=201.25) -->
    <line x1="320" y1="157.5" x2="320" y2="201.25" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <circle cx="320" cy="200.4" r="3" fill="#ec4899" />
    <circle cx="320" cy="157.5" r="5" fill="#ec4899" stroke="#0f172a" stroke-width="2" />
    <rect x="235" y="146" width="75" height="22" rx="4" fill="#701a75" stroke="#c026d3" stroke-width="1" />
    <text x="272" y="161" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fdf4ff" text-anchor="middle">77.50 [Champ]</text>
    <text x="272" y="204" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#d8b4fe" text-anchor="end">Mean: 71.37</text>

    <!-- Penalty Callout Gen 0/1 -->
    <rect x="360" y="70" width="140" height="34" rx="5" fill="#4c0519" stroke="#e11d48" stroke-width="1" opacity="0.9" />
    <text x="430" y="84" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#fecdd3" text-anchor="middle">Sandbox Penalty Barrier</text>
    <text x="430" y="97" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#fda4af" text-anchor="middle">-18.75 to -25.0 pts docked</text>

    <!-- Gen 1 Parallel Spread (x=530): Champion 76.55 (y=164.15), Mean 69.60 (y=212.8) -->
    <line x1="530" y1="164.15" x2="530" y2="212.8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="530" cy="212.8" r="3" fill="#f59e0b" />
    <circle cx="530" cy="164.15" r="5" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <rect x="542" y="153" width="75" height="22" rx="4" fill="#78350f" stroke="#d97706" stroke-width="1" />
    <text x="579" y="168" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">76.55 [Champ]</text>
    <text x="542" y="217" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#fde68a" text-anchor="start">Mean: 69.60</text>

    <!-- Gen 2 Breakthrough (x=730): Champion 94.50 (y=38.5), Mean 81.52 (y=129.36) -->
    <line x1="730" y1="38.5" x2="730" y2="129.36" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="730" cy="129.36" r="3.5" fill="#10b981" />
    <text x="742" y="133" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#6ee7b7" text-anchor="start">Mean: 81.52 (+11.9)</text>

    <!-- Gen 2 Champion Badge (Convergence Point) -->
    <circle cx="730" cy="38.5" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
    <rect x="660" y="2" width="140" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="730" y="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ecfdf5" text-anchor="middle">94.50 [Gen 2 Record]</text>

    <!-- Zero Penalty Banner -->
    <rect x="645" y="70" width="170" height="34" rx="5" fill="#064e3b" stroke="#059669" stroke-width="1" opacity="0.95" />
    <text x="730" y="84" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">PENALTY ELIMINATED (0.00)</text>
    <text x="730" y="97" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#6ee7b7" text-anchor="middle">10 Files Extracted · All 4 Gates Pass</text>
  </g>

  <!-- Metric Highlights Strip (Bottom 4 Cards) -->
  <g transform="translate(48, 432)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">TOURNAMENT RECORD</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#34d399">94.50 pts</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">+17.95 pt Surge in Gen 2</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(220, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">SANDBOX PASS RATE</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#10b981">90% Code</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">3 Firms with 0.00 Penalty</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(440, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">COHORT MEAN LEAP</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">+11.92 pts</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">69.60 → 81.52 Population Mean</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(660, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">PERSONA DISCRETIZATION</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ec4899">Trait Alleles</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Crossover + Consensus Mining</text>
    </g>
  </g>
</svg>
