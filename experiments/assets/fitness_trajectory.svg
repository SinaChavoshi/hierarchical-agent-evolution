    <text x="600" y="133" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#6ee7b7" text-anchor="start">Mean: 81.52</text>

