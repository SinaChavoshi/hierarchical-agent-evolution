<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Track A Gradients (Emerald to Cyan) -->
    <linearGradient id="trackAGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="trackAArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Track B Gradients (Indigo to Fuchsia) -->
    <linearGradient id="trackBGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="trackBArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="556" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">
      Generational Fitness Trajectory &amp; Architecture Optimization
    </text>
    <text x="0" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
      Empirical comparison between unconstrained semantic reasoning and grounded deterministic sandbox verification
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 36)">
    <!-- Track A Legend -->
    <line x1="0" y1="8" x2="24" y2="8" stroke="url(#trackAGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="12" cy="8" r="4" fill="#06b6d4" />
    <text x="32" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0">
      Unconstrained Search (Exp 001)
    </text>

    <!-- Track B Legend -->
    <line x1="0" y1="28" x2="24" y2="28" stroke="url(#trackBGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2" />
    <circle cx="12" cy="28" r="4" fill="#ec4899" />
    <text x="32" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0">
      Deterministic Sandbox (Exp 002 / 003)
    </text>
  </g>

  <!-- Chart Grid Area (x: 80 to 880, y: 110 to 390) -->
  <g transform="translate(80, 110)">
    <!-- Horizontal Grid Lines &amp; Y-Labels -->
    <!-- 100 pts -->
    <line x1="0" y1="0" x2="800" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-12" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">100</text>

    <!-- 90 pts -->
    <line x1="0" y1="56" x2="800" y2="56" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-12" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">90</text>

    <!-- 80 pts -->
    <line x1="0" y1="112" x2="800" y2="112" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-12" y="116" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">80</text>

    <!-- 70 pts -->
    <line x1="0" y1="168" x2="800" y2="168" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-12" y="172" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">70</text>

    <!-- 60 pts -->
    <line x1="0" y1="224" x2="800" y2="224" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-12" y="228" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">60</text>

    <!-- Vertical Milestone Markers -->
    <!-- Milestone 1: Gen 0 Seed (x=100) -->
    <line x1="100" y1="0" x2="100" y2="236" stroke="#1e293b" stroke-width="1" />
    <text x="100" y="254" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 0 Baseline</text>
    <text x="100" y="268" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Seed Enterprise (31 Agents)</text>

    <!-- Milestone 2: Gen 0 Parallel Tournament (x=400) -->
    <line x1="400" y1="0" x2="400" y2="236" stroke="#1e293b" stroke-width="1" />
    <text x="400" y="254" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 0 Tournament</text>
    <text x="400" y="268" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">10 Firms (310 Agents)</text>

    <!-- Milestone 3: Gen 1 Evolved (x=700) -->
    <line x1="700" y1="0" x2="700" y2="236" stroke="#1e293b" stroke-width="1" />
    <text x="700" y="254" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gen 1 Evolved</text>
    <text x="700" y="268" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">3-Way Breeding + Mutants</text>

    <!-- Track A: Shaded Area & Line (Unconstrained) -->
    <!-- Points: (100, 39.2) [93.00], (400, 30.2) [94.60], (700, 21.0) [96.25] -->
    <polygon points="100,39.2 400,30.2 700,21.0 700,224 100,224" fill="url(#trackAArea)" />
    <path d="M 100 39.2 C 250 35, 550 25, 700 21.0" fill="none" stroke="url(#trackAGrad)" stroke-width="3.5" />

    <!-- Track A Nodes & Labels -->
    <g transform="translate(100, 39.2)">
      <circle cx="0" cy="0" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="0" y="-14" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">93.00</text>
    </g>
    <g transform="translate(400, 30.2)">
      <circle cx="0" cy="0" r="5" fill="#06b6d4" stroke="#0f172a" stroke-width="2" />
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#164e63" stroke="#0891b2" stroke-width="1" />
      <text x="0" y="-14" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#cffafe" text-anchor="middle">94.60</text>
    </g>
    <g transform="translate(700, 21.0)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
      <rect x="-42" y="-30" width="84" height="22" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="-15" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f0f9ff" text-anchor="middle">96.25 [Top]</text>
    </g>

    <!-- Sandbox Penalty Callout Bar at x=400 -->
    <line x1="400" y1="30.2" x2="400" y2="126" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="410" y="64" width="165" height="38" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1" opacity="0.95" />
    <text x="420" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fecdd3">Deterministic Gate Penalty</text>
    <text x="420" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#fda4af">-18.75 to -25.0 pts docked</text>

    <!-- Track B: Shaded Area & Line (Deterministic Sandbox) -->
    <!-- Points: (400, 161.0) [71.25 floor], (400, 126.0) [77.50 Champion], (700, 48.0) [~91.50 Gen 1 Target] -->
    <polygon points="400,126 700,48 700,224 400,224" fill="url(#trackBArea)" />
    
    <!-- Gen 0 Spread bar at x=400 -->
    <line x1="400" y1="126" x2="400" y2="161" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <circle cx="400" cy="161" r="4" fill="#a855f7" />
    <text x="390" y="165" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d8b4fe" text-anchor="end">71.25 (Floor)</text>

    <path d="M 400 126 C 520 120, 620 65, 700 48" fill="none" stroke="url(#trackBGrad)" stroke-width="3.5" stroke-dasharray="6 3" />

    <!-- Track B Nodes & Labels -->
    <g transform="translate(400, 126)">
      <circle cx="0" cy="0" r="5" fill="#ec4899" stroke="#0f172a" stroke-width="2" />
      <rect x="-80" y="-12" width="72" height="20" rx="4" fill="#701a75" stroke="#c026d3" stroke-width="1" />
      <text x="-44" y="2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#fdf4ff" text-anchor="middle">77.50 (Firm 3)</text>
    </g>

    <g transform="translate(700, 48)">
      <circle cx="0" cy="0" r="6" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
      <rect x="-65" y="-30" width="130" height="24" rx="5" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
      <text x="0" y="-14" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ffe4e6" text-anchor="middle">Gen 1 Target (&gt;90)</text>
    </g>
  </g>

  <!-- Metric Highlights Strip (Bottom 4 Cards) -->
  <g transform="translate(48, 430)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">PEAK SEMANTIC ASCENT</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">+3.25 pts</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">93.00 → 96.25 (Exp 001)</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(220, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">DISTRIBUTED THROUGHPUT</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#10b981">4.1x Speedup</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">91m → 22m on Kubernetes</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(440, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">HEADCOUNT PLASTICITY</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f59e0b">31 → 36</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Autonomous role injection</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(660, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">DETERMINISTIC SANDBOX</text>
      <text x="16" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ec4899">4 Hard Gates</text>
      <text x="16" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Build · Smoke · OTel · Tests</text>
    </g>
  </g>
</svg>
