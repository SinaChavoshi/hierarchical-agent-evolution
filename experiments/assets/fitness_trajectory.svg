    <circle cx="420" cy="164.15" r="5" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <rect x="430" y="153" width="70" height="20" rx="4" fill="#78350f" stroke="#d97706" stroke-width="1" />
    <text x="465" y="167" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#fef3c7" text-anchor="middle">76.55 [Gen 1]</text>

