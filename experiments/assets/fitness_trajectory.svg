    <text x="352" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#fda4af" text-anchor="middle">-18.75 to -25.0 docked</text>

    <!-- Gen 1 Parallel Spread (x=420): Champion 76.55 -->
    <line x1="420" y1="164.15" x2="420" y2="212.8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
