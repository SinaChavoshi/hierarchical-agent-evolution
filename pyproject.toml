[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-agent-evolution"
version = "0.1.0"
description = "Hierarchical Agent Evolution: Bootstrapping Agentic Organizations on Cloud Kubernetes"
readme = "README.md"
authors = [
    { name = "Sina Chavoshi", email = "chavoshi@google.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0.0",
    "google-auth>=2.0.0",
]
requires-python = ">=3.10"

[project.scripts]
agent-evolution = "src.main:main"
