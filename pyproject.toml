[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-agent-evolution"
version = "2.0.0.dev0"
description = "Evolving hierarchical agent organisations against execution-grounded fitness"
readme = "README.md"
authors = [
    { name = "Sina Chavoshi", email = "chavoshi@google.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "google-auth>=2.30.0",
    "google-cloud-storage>=2.18.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
# The harness needs these to reach a verdict rather than SKIP. They are not
# imported by the platform itself, so they are separated out.
harness = [
    "pytest>=8.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
]

[project.scripts]
hae = "hae.cli:main"

[tool.setuptools.packages.find]
include = ["hae*"]
