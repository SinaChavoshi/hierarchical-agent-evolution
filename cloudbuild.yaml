steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:latest',
    '.'
  ]
images:
- 'us-central1-docker.pkg.dev/gemle-gke-dev/chavoshi-repo/agent-evolution:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
